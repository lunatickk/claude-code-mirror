name: Download Claude Code Desktop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    type: update

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get download URL
        id: get-url
        run: |
          curl -sI "https://claude.ai/api/desktop/darwin/universal/dmg/latest/redirect" | grep -i "^location:" | cut -d' ' -f2 | tr -d '\r\n' > actual_url.txt
          echo "URL=$(cat actual_url.txt)" >> $GITHUB_OUTPUT

      - name: Download DMG
        run: |
          curl -L -o claude-code-desktop.dmg "$(cat actual_url.txt)" --max-time 600

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: claude-code-desktop.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}